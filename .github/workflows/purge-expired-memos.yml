name: Purge expired trash

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke the Supabase purge function
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PURGE_CRON_SECRET: ${{ secrets.PURGE_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$PURGE_CRON_SECRET" ]; then
            echo "Configure SUPABASE_URL, SUPABASE_ANON_KEY, and PURGE_CRON_SECRET in GitHub Actions secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 120 \
            --request POST \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --header "x-purge-cron-secret: $PURGE_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL%/}/functions/v1/purge-expired-memos"
